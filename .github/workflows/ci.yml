name: CI — Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Build common library + all service modules
  # ─────────────────────────────────────────────────────────
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build all modules (skip tests)
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: '**/target/*.jar'
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # Job 2: Unit tests (fast, no containers needed)
  # ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        run: |
          mvn test \
            -pl auth-service,queue-service \
            -Dtest="**/*Test" \
            -DexcludeTests="**/*IntegrationTest" \
            --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/target/surefire-reports/TEST-*.xml'

  # ─────────────────────────────────────────────────────────
  # Job 3: Integration tests (Testcontainers — needs Docker)
  # ─────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests (Testcontainers)
        run: |
          mvn test \
            -pl auth-service,queue-service \
            -Dtest="**/*IntegrationTest" \
            --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test
          TESTCONTAINERS_REUSE_ENABLE: true

      - name: Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/target/surefire-reports/TEST-*.xml'

  # ─────────────────────────────────────────────────────────
  # Job 4: Docker Compose smoke test
  # ─────────────────────────────────────────────────────────
  docker-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=smartqueue
          POSTGRES_PASSWORD=smartqueue_ci_pass
          REDIS_PASSWORD=redis_ci_pass
          JWT_SECRET=Y2ktdGVzdC1qd3Qtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1IUzUxMg==
          JWT_ACCESS_EXPIRY_MS=900000
          JWT_REFRESH_EXPIRY_MS=604800000
          KAFKA_BOOTSTRAP_SERVERS=kafka:9092
          MAIL_USERNAME=ci@test.com
          MAIL_PASSWORD=dummy
          SMS_MOCK_MODE=true
          EOF

      - name: Start infrastructure only (postgres, redis, kafka)
        run: |
          docker compose up -d postgres redis zookeeper kafka
          echo "Waiting for infrastructure to be healthy..."
          timeout 120 bash -c 'until docker compose ps | grep -E "postgres.*healthy" && docker compose ps | grep -E "redis.*healthy"; do sleep 5; done'

      - name: Verify Postgres databases were created
        run: |
          docker compose exec -T postgres psql -U smartqueue -c '\l' | grep -E "auth_db|queue_db|notification_db|analytics_db|admin_db"

      - name: Verify Kafka topics were created
        run: |
          timeout 60 bash -c 'until docker compose exec -T kafka kafka-topics --bootstrap-server kafka:9092 --list 2>/dev/null | grep "token.booked"; do sleep 5; done'
          docker compose exec -T kafka kafka-topics --bootstrap-server kafka:9092 --list

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────
  # Job 5: Secret scanning (GitGuardian)
  # ─────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        continue-on-error: true  # Don't block CI, just warn
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
