name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx2g -XX:+TieredCompilation -XX:TieredStopAtLevel=1'
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build common library + all service modules
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # Verify Maven is available
      - name: Maven version
        run: mvn --version

      # Build ALL modules. If this step fails, the error message shows exactly
      # which class/file caused the compile error.
      - name: Build all modules (skip tests)
        run: |
          mvn clean package \
            -DskipTests \
            --no-transfer-progress \
            --batch-mode \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: service-jars
          path: '**/target/*.jar'
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Job 2: Unit tests — wildcard pattern across ALL services
  # FIX: replaced hardcoded class list with wildcard convention
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests (all services, wildcard)
        run: |
          mvn test \
            -pl auth-service,queue-service,notification-service,analytics-service,admin-service,gateway \
            --no-transfer-progress \
            --batch-mode \
            -Dtest="**/*Test" \
            -DexcludeTests="**/*IntegrationTest" \
            -Dsurefire.failIfNoSpecifiedTests=false
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v3
        if: always()
        with:
          files: '**/target/surefire-reports/TEST-*.xml'

  # ─────────────────────────────────────────────────────────────
  # Job 3: Code Coverage (JaCoCo) — NEW
  # ─────────────────────────────────────────────────────────────
  code-coverage:
    name: Code Coverage (JaCoCo)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with JaCoCo instrumentation
        run: |
          mvn test jacoco:report \
            -pl auth-service,queue-service,notification-service,analytics-service,admin-service,gateway \
            --no-transfer-progress \
            --batch-mode \
            -Dtest="**/*Test" \
            -DexcludeTests="**/*IntegrationTest" \
            -Dsurefire.failIfNoSpecifiedTests=false
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload JaCoCo HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: '**/target/site/jacoco/'
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 4: Integration tests — wildcard pattern
  # FIX: replaced hardcoded class list with wildcard convention
  # ─────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests (Testcontainers, wildcard)
        run: |
          mvn test \
            -pl auth-service,queue-service \
            --no-transfer-progress \
            --batch-mode \
            -Dtest="**/*IntegrationTest" \
            -Dsurefire.failIfNoSpecifiedTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
          TESTCONTAINERS_REUSE_ENABLE: 'false'
          # Testcontainers needs Docker socket
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v3
        if: always()
        with:
          files: '**/target/surefire-reports/TEST-*.xml'

  # ─────────────────────────────────────────────────────────────
  # Job 5: Static Analysis — SpotBugs + Checkstyle — NEW
  # Advisory: continue-on-error=true, does not block merge
  # ─────────────────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis (SpotBugs + Checkstyle)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run SpotBugs (bug pattern detection)
        run: |
          mvn spotbugs:check \
            --no-transfer-progress \
            --batch-mode \
            -DskipTests
        continue-on-error: true   # Advisory — does not block merge

      - name: Run Checkstyle (code style)
        run: |
          mvn checkstyle:check \
            --no-transfer-progress \
            --batch-mode \
            -DskipTests
        continue-on-error: true   # Advisory — does not block merge

      - name: Upload SpotBugs XML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: '**/target/spotbugsXml.xml'
          retention-days: 7

      - name: Upload Checkstyle Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-report
          path: '**/target/checkstyle-result.xml'
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 6: OWASP Dependency Vulnerability Scan — NEW
  # Advisory: only fails on CVSS >= 9 (critical)
  # ─────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency Vulnerability Scan (OWASP)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: OWASP Dependency Check (fail on CVSS >= 9)
        run: |
          mvn dependency-check:check \
            --no-transfer-progress \
            --batch-mode \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFile=.github/dependency-check-suppression.xml \
            -Dformat=HTML
        continue-on-error: true   # Advisory — report surfaces, does not hard-block

      - name: Upload OWASP HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: '**/target/dependency-check-report.html'
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Job 7: Docker Compose infrastructure smoke test
  # FIX: JWT_SECRET sourced from GitHub Secret with CI fallback
  # ─────────────────────────────────────────────────────────────
  docker-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for CI
        env:
          CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: |
          # Use repo secret if available, fall back to safe CI placeholder
          JWT_VAL="${CI_JWT_SECRET:-Y2ktdGVzdC1qd3Qtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1IUzUxMg==}"
          cat > .env << EOF
          POSTGRES_USER=smartqueue
          POSTGRES_PASSWORD=smartqueue_ci_pass
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          AUTH_DB=auth_db
          QUEUE_DB=queue_db
          NOTIF_DB=notification_db
          ANALYTICS_DB=analytics_db
          ADMIN_DB=admin_db
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_PASSWORD=redis_ci_pass
          KAFKA_BOOTSTRAP_SERVERS=kafka:9092
          JWT_SECRET=${JWT_VAL}
          JWT_ACCESS_EXPIRY_MS=900000
          JWT_REFRESH_EXPIRY_MS=604800000
          MAIL_USERNAME=ci@test.com
          MAIL_PASSWORD=dummy
          MAIL_HOST=localhost
          MAIL_PORT=1025
          SMS_MOCK_MODE=true
          GOOGLE_CLIENT_ID=dummy
          GOOGLE_CLIENT_SECRET=dummy
          TWILIO_ACCOUNT_SID=dummy
          TWILIO_AUTH_TOKEN=dummy
          TWILIO_PHONE_NUMBER=+10000000000
          AUTH_SERVICE_URL=http://auth-service:8081
          QUEUE_SERVICE_URL=http://queue-service:8082
          NOTIF_SERVICE_URL=http://notification-service:8083
          ANALYTICS_SERVICE_URL=http://analytics-service:8084
          ADMIN_SERVICE_URL=http://admin-service:8085
          EOF

      - name: Start infrastructure only (postgres, redis, kafka)
        run: |
          docker compose up -d postgres redis zookeeper kafka
          echo "Waiting for postgres and redis to be healthy..."
          timeout 120 bash -c '
            until docker compose ps postgres | grep -q "healthy" && \
                  docker compose ps redis | grep -q "healthy"; do
              echo "  still waiting..."
              sleep 5
            done
          '
          echo "Infrastructure is up."

      - name: Verify Postgres databases were created
        run: |
          docker compose exec -T postgres psql -U smartqueue -c '\l' | \
            grep -E "auth_db|queue_db|notification_db|analytics_db|admin_db"
          echo "All 5 databases verified."

      - name: Verify Kafka topics were created
        run: |
          timeout 90 bash -c '
            until docker compose exec -T kafka \
              kafka-topics --bootstrap-server kafka:9092 --list 2>/dev/null \
              | grep -q "token.booked"; do
              echo "  waiting for Kafka topics..."
              sleep 5
            done
          '
          echo "Kafka topics:"
          docker compose exec -T kafka kafka-topics --bootstrap-server kafka:9092 --list

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # ─────────────────────────────────────────────────────────────
  # Job 8: Secret scanning (GitGuardian)
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    # Run independently — does not need build to succeed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        # Always continue — secret scan is advisory, not a gate
        continue-on-error: true
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # ─────────────────────────────────────────────────────────────
  # Job 9: CD — Build & Push Docker images to GHCR — NEW
  # Runs ONLY on push to main, after unit + integration + smoke pass
  # Uses matrix to build all 6 services in parallel
  # ─────────────────────────────────────────────────────────────
  release:
    name: "Release: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [ unit-tests, integration-tests, docker-smoke-test ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - queue-service
          - notification-service
          - analytics-service
          - admin-service
          - gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR (skip tests — already verified by earlier jobs)
        run: |
          mvn clean package -DskipTests \
            -pl common,${{ matrix.service }} \
            --am \
            --no-transfer-progress \
            --batch-mode

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/smart-queue-${{ matrix.service }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
